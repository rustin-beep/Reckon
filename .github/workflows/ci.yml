name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # 工具链版本钉死：必须带构建哈希，因为 CDN 只对完整的 key 提供
  # `binaries/<version>/` 与 `cores/core-<version>.*`（裸 `0.10.22` 返回 403）。
  # 安装脚本会把 `+` 转义成 `%2B`。
  #
  # 2026-11-21 从 0.10.21+06da1ed44 升到这里：本地开发工具链已是 0.10.22，
  # 而 `moon fmt` 的输出跨版本会漂移，CI 与本地必须同版本，否则「格式与接口漂移」
  # 那一步会拿两个版本互相打架。
  MOONBIT_VERSION: "0.10.22+124d61d05"

jobs:
  # R11 闸门：只允许 import moonbitlang/* 与 moonbit-community/*。
  # 单独一个 job，工具链下载慢或不可用时它仍能给出结论。
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/depcheck/go.mod

      - name: 依赖白名单
        working-directory: tools/depcheck
        run: |
          go test ./...
          go run . ../../moon.mod

  moon:
    # 两个 OS：Linux 覆盖 gcc，macOS 覆盖 clang + Apple 的 libc 差异。
    # Windows 未接线：官方安装脚本在 Windows 上走 `install/powershell.ps1`（与
    # unix.sh 的版本钉传参方式不同），native 目标还要 cl.exe 在 PATH 上；两者都没
    # 在真机 CI 上验过，且 `moon fmt` 的漂移检查会碰上本仓既有的 CRLF/LF 债。
    # 见 AGENTS「工具链」——先在真机上把安装与 MSVC 验通，再并入主门禁。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 官方安装脚本（下载页给出的那个），显式传版本号；不用第三方 setup action。
      - name: 安装 MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: 工具链版本
        run: moon version --all

      # 干净检出没有 registry 索引：`moon check` 会在依赖解析阶段直接失败
      # （`Failed to resolve registry dependency moonbitlang/x ... module was not
      # found in the registry`），耗时 0 秒、exit 255——看起来像「命令本身报错」。
      # 2026-11-21 用 pin 版本的二进制在干净检出上复现：加这一步即恢复。
      # 装依赖是 check 的前置条件，不能指望 check 顺手去做。
      - name: 更新 registry 索引
        run: moon update

      - name: 类型检查（全部后端，warning 即失败）
        run: moon check --target all --deny-warn

      # fmt 与 .mbti 都是工具链生成物，手改不允许留到提交里。
      - name: 格式与接口漂移
        run: |
          moon fmt
          moon info
          git diff --exit-code

      # 注意：`moon test` 不带 --target 时走 moon.mod 的 preferred_target（native），
      # 四个后端必须显式声明，否则 wasm-gc 实际不会被执行。
      # wasm（非 gc、线性内存）原先漏了：它和 wasm-gc 是两条不同的代码生成路径，
      # 本地实测可跑（211/211），所以在这里补上。
      #
      # 每个后端把 `Total tests:` 抄到文件里，下一步比对——否则某个后端「跑了 0 条
      # 却 exit 0」也能过（这类静默比失败更难发现）。`pipefail` 保证 tee 不会吞掉
      # 测试的退出码。
      - name: 测试（wasm-gc）
        run: |
          set -o pipefail
          moon test --target wasm-gc | tee "$RUNNER_TEMP/wasm-gc.log"
          sed -n 's/^Total tests: \([0-9]*\).*/\1/p' "$RUNNER_TEMP/wasm-gc.log" > "$RUNNER_TEMP/wasm-gc.count"

      - name: 测试（wasm）
        run: |
          set -o pipefail
          moon test --target wasm | tee "$RUNNER_TEMP/wasm.log"
          sed -n 's/^Total tests: \([0-9]*\).*/\1/p' "$RUNNER_TEMP/wasm.log" > "$RUNNER_TEMP/wasm.count"

      - name: 测试（js）
        run: |
          set -o pipefail
          moon test --target js | tee "$RUNNER_TEMP/js.log"
          sed -n 's/^Total tests: \([0-9]*\).*/\1/p' "$RUNNER_TEMP/js.log" > "$RUNNER_TEMP/js.count"

      - name: 测试（native）
        run: |
          set -o pipefail
          moon test --target native | tee "$RUNNER_TEMP/native.log"
          sed -n 's/^Total tests: \([0-9]*\).*/\1/p' "$RUNNER_TEMP/native.log" > "$RUNNER_TEMP/native.count"

      - name: 多端测试计数一致
        run: |
          set -eu
          test -s "$RUNNER_TEMP/native.count"
          test "$(cat "$RUNNER_TEMP/native.count")" -gt 0
          for t in wasm-gc wasm js; do
            cmp "$RUNNER_TEMP/native.count" "$RUNNER_TEMP/$t.count"
          done

      # 多端一致性：同一份 fixture 在四个后端各跑一遍 `reckon statetest`，比对
      # ① JSON 报告逐字节、② 去掉 CR 之后的 stdout 逐字节。
      #
      # 为什么比报告：报告经 `write_string_to_file` 落盘，不做行尾转换，是真正的
      # 逐字节可比；stdout 在 Windows 上是 CRLF、js/wasm 是 LF（本机实测 native
      # 输出 `\r\n`、js 输出 `\n`），所以文本先 `tr -d '\r'`。
      #
      # 覆盖的是最容易分叉的部分：JSON 序列化（数字形态/转义/键序）、U256 十六进制、
      # 地址/槽排序与计数。执行正确性不在这一层（executor 仍是 stub）。
      - name: 多端报告一致性
        run: |
          set -eu
          f=statetest/testdata/one_case.json
          for t in wasm-gc wasm js native; do
            moon run cmd/main --target "$t" -- \
              statetest "$f" --fork Cancun --report "$RUNNER_TEMP/arm.json" \
              > "$RUNNER_TEMP/$t.txt"
            cp "$RUNNER_TEMP/arm.json" "$RUNNER_TEMP/$t.json"
            tr -d '\r' < "$RUNNER_TEMP/$t.txt" > "$RUNNER_TEMP/$t.clean"
          done
          for t in wasm-gc wasm js; do
            cmp "$RUNNER_TEMP/native.json" "$RUNNER_TEMP/$t.json"
            cmp "$RUNNER_TEMP/native.clean" "$RUNNER_TEMP/$t.clean"
          done
